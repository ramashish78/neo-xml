services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    ports:
      - "8017:8017"
    environment:
      ENVIRONMENT: development
      MONGODB_URI: mongodb://mongo:27017
      MONGO_DB: neo_xml
      JWT_SECRET: dev-only-change-me
      UPLOAD_ROOT: /app/uploads
      CORS_ORIGINS: http://localhost:8017
      ADMIN_EMAIL: admin@neo-xml.local
      ADMIN_PASSWORD: ChangeMe123!
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  uploads:
